version: '3'

services:
    mysql:
        image: mysql:8.0
        command: "--lower-case-table-names=1 --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci"
        environment:
            MYSQL_DATABASE: ${MYSQL_DATABASE}
            MYSQL_USER: ${MYSQL_USER}
            MYSQL_PASSWORD: ${MYSQL_PASSWORD}
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
        ports:
            - "${MYSQL_HOST_PORT:-3307}:3306"
        networks:
            - internal
        volumes:
            - mysql-data:/var/lib/mysql:rw
            - ./mysql/custom.cnf:/etc/mysql/conf.d/custom.cnf
            - ./mysql/init:/docker-entrypoint-initdb.d

    php:
        build:
            context: ./php
            args:
                XDEBUG_ON: ${XDEBUG_ON}
                XDEBUG_MODE: ${XDEBUG_MODE}
                XDEBUG_IDEKEY: ${XDEBUG_IDEKEY}
                XDEBUG_PORT: ${XDEBUG_PORT}
        environment:
            - PHP_IDE_CONFIG=serverName=${XDEBUG_TRIGGER}
            - XDEBUG_TRIGGER=${XDEBUG_TRIGGER}
        networks:
            - internal
        extra_hosts:
            - "host.docker.internal:host-gateway"
        volumes:
            - ../:/var/www/public
            - ./php/local.ini:/usr/local/etc/php/conf.d/local.ini

    worker:
        build:
            context: ./php
            args:
                XDEBUG_ON: ${XDEBUG_ON}
                XDEBUG_MODE: ${XDEBUG_MODE}
                XDEBUG_IDEKEY: ${XDEBUG_IDEKEY}
                XDEBUG_PORT: ${XDEBUG_PORT}
        command: php bin/console messenger:consume async --time-limit=3600 -vv
        restart: unless-stopped
        environment:
            - PHP_IDE_CONFIG=serverName=${XDEBUG_TRIGGER}
            - XDEBUG_TRIGGER=${XDEBUG_TRIGGER}
        networks:
            - internal
        extra_hosts:
            - "host.docker.internal:host-gateway"
        volumes:
            - ../:/var/www/public
            - ./php/local.ini:/usr/local/etc/php/conf.d/local.ini

    node:
        image: node:20-alpine
        working_dir: /var/www/project/web
        command: sh -c "corepack enable && yarn && yarn dev --host"
        ports:
            - "3000:3000"
        volumes:
            - ../:/var/www/project
        networks:
            - internal

    nginx:
        image: nginx:1.27
        ports:
            - "80:80"
        networks:
            - internal
        volumes:
            - ../:/var/www/public
            - ./nginx/sites:/etc/nginx/conf.d

volumes:
    mysql-data:

networks:
    internal:
        driver: bridge
