services:
    _defaults:
        public: true
        autowire: true
        autoconfigure: true

    Domain\Click\Repositories\ClickRepositoryInterface:
        class: Infrastructure\Persistence\Repositories\Click\ClickRepository

    Domain\Click\Commands\Handlers\:
        resource: '%kernel.project_dir%/src/Domain/Click/Commands/Handlers/'

    Domain\Click\Queries\Handlers\:
        resource: '%kernel.project_dir%/src/Domain/Click/Queries/Handlers/'

when@test:
    services:
        _defaults:
            autoconfigure: true
            autowire: true
            public: true

        Infrastructure\Persistence\Repositories\Click\ClickRepository: ~
        Infrastructure\Persistence\Repositories\Click\InMemoryClickRepository: ~

        Domain\Click\Repositories\ClickRepositoryInterface:
            class: Infrastructure\Persistence\Repositories\Click\TestClickRepository
            arguments:
                $clickRepository: '@Infrastructure\Persistence\Repositories\Click\ClickRepository'
                $inMemoryClickRepository: '@Infrastructure\Persistence\Repositories\Click\InMemoryClickRepository'
