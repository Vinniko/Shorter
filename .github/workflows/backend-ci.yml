name: Backend Continuous Integration

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - bin/**
      - config/**
      - migrations/**
      - public/**
      - src/**
      - tests/**
      - composer.json
      - composer.lock
      - .env
      - .env.test
      - deptrac.yaml
      - grumphp.yml
      - phpstan.neon
      - phpunit.dist.xml

jobs:
  backend:
    name: Lint & Test (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        php-version: ['8.3']
    env:
      DATABASE_URL: mysql://shorter:shorter@127.0.0.1:3306/shorter?serverVersion=8.0.35&charset=utf8mb4

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: shorter
          MYSQL_USER: shorter
          MYSQL_PASSWORD: shorter
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: ctype, iconv, pdo_mysql, intl, zip, opcache, mbstring, dom, xml
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install composer dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Run database migrations
        run: php bin/console doctrine:migrations:migrate --no-interaction --env=test

      - name: Warm up dev cache
        run: php bin/console cache:warmup --env=dev

      - name: Run phpstan
        run: vendor/bin/phpstan analyse --memory-limit=768M

      - name: Run deptrac
        run: vendor/bin/deptrac analyse --no-cache

      - name: Check composer.json normalization
        run: composer normalize --dry-run

      - name: Run tests
        run: vendor/bin/phpunit
